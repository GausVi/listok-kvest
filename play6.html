<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a3428">
  <title>Квест закрыт</title>
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/cyrillic-700-normal.woff2") format("woff2");
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: "Cormorant Garamond";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/latin-700-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Cormorant Garamond";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("fonts/cyrillic-500-normal.woff2") format("woff2");
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: "Cormorant Garamond";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("fonts/latin-500-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      color: #3a2618;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 226, 186, 0.18), transparent 32%),
        #4a3428;
    }
    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 16px 32px;
    }
    .screen { width: min(460px, 100%); }
    .scroll { position: relative; }
    .roll {
      height: 30px;
      margin: 0 10px;
      border-radius: 16px;
      background:
        linear-gradient(90deg, rgba(80, 46, 20, 0.18), transparent 8%, transparent 92%, rgba(80, 46, 20, 0.18)),
        linear-gradient(180deg, #f3ddb4 0%, #c99658 20%, #8b5a30 46%, #f0d7a6 52%, #6e4524 80%, #d8b27a 100%);
      box-shadow: 0 6px 10px rgba(48, 26, 10, 0.18);
    }
    .sheet {
      margin: -10px 18px;
      position: relative;
      z-index: 1;
      padding: 34px 22px 30px;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.45), transparent 26%),
        radial-gradient(circle at 84% 88%, rgba(168, 112, 52, 0.14), transparent 28%),
        linear-gradient(180deg, #f8edd4, #f4e3be 46%, #edd6a6);
      box-shadow: 0 16px 30px rgba(48, 26, 10, 0.16);
    }
    h1, p {
      margin: 0;
      text-align: center;
      font-weight: 700;
    }
    h1 {
      font-size: 36px;
      line-height: 1.15;
    }
    p {
      margin-top: 18px;
      font-weight: 500;
      font-size: 22px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <main>
    <section class="screen">
      <div class="scroll">
        <div class="roll"></div>
        <div class="sheet">
          <h1>Квест закрыт</h1>
          <p>Квест уже проведён и закрыт.</p>
        </div>
        <div class="roll"></div>
      </div>
    </section>
  </main>
</body>
</html>
